name: Test

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Require successful build workflow
      run: |
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "Build workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Skipping tests because build did not succeed."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Download build binaries from triggering run
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.event.workflow_run.id }}
        name: build-binaries
        path: build-output
        if_no_artifact_found: fail

    - name: Discover test assemblies
      shell: pwsh
      run: |
        $assemblies = Get-ChildItem -Path "build-output" -Recurse -Filter "*.dll" |
          Where-Object { $_.Name -match '(?i)(test|tests)' } |
          Where-Object { $_.Name -notmatch '(?i)(testhost|microsoft\.testplatform|xunit|nunit|mstest)' } |
          Select-Object -ExpandProperty FullName -Unique

        if (-not $assemblies) {
          throw "No test assemblies found in downloaded build artifact."
        }

        $assemblies | Set-Content -Path "test-assemblies.txt"
        Write-Host "Discovered $($assemblies.Count) test assembly(ies)."

    - name: Execute tests from compiled binaries
      shell: pwsh
      run: |
        $assemblies = Get-Content -Path "test-assemblies.txt"
        dotnet vstest $assemblies --logger:"trx;LogFileName=test-results.trx" --ResultsDirectory "TestResults"

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: .NET Tests
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Upload test result artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-trx
        path: TestResults/**/*.trx
        if-no-files-found: ignore

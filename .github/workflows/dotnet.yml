name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: .NET Tests
        path: TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Upload test result artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-trx
        path: TestResults/**/*.trx
        if-no-files-found: ignore
